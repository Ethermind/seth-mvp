<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SETH Terminal UI // Project Oracle</title>

  <!-- React 18 & Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Retro Monospace Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Share Tech Mono', monospace, 'Courier New', Courier;
      background-color: #030308;
      color: #00f0ff;
    }

    /* CRT Scanlines Overlay */
    .crt::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      z-index: 40;
      pointer-events: none;
      opacity: 0.75;
    }

    /* Subtle CRT Vignette */
    .crt::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.75) 100%);
      z-index: 41;
      pointer-events: none;
    }

    /* Retro ASCII Scrollbar (WebKit) */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #090914; border-left: 1px solid #00f0ff; }
    ::-webkit-scrollbar-thumb { background: #00f0ff; border: 1px solid #090914; }
    ::-webkit-scrollbar-thumb:hover { background: #ff007f; }

    /* Retro ASCII Scrollbar (Firefox) */
    * { scrollbar-width: thin; scrollbar-color: #00f0ff #090914; }

    /* Neon Glow Effects */
    .glow-cyan { text-shadow: 0 0 8px rgba(0, 240, 255, 0.8); }
    .glow-green { text-shadow: 0 0 8px rgba(57, 255, 20, 0.8); }
    .glow-amber { text-shadow: 0 0 8px rgba(255, 176, 0, 0.8); }
    .glow-magenta { text-shadow: 0 0 8px rgba(255, 0, 127, 0.8); }

    .box-glow {
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.18), inset 0 0 10px rgba(0, 240, 255, 0.05);
    }

    /* Blinking Terminal Cursor */
    .blink { animation: blinker 1s cubic-bezier(0.5, 0, 1, 1) infinite; }
    @keyframes blinker { 50% { opacity: 0; } }

    /* REC dot pulse */
    .rec-pulse { animation: recpulse 1.2s ease-in-out infinite; }
    @keyframes recpulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Attachment chip enter */
    @keyframes chipIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chip-in { animation: chipIn 0.15s ease-out; }

    textarea:focus { outline: none; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center p-2 sm:p-4 crt">

  <div id="root" class="w-full h-full max-w-6xl"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ---------- ASCII / decorative helpers ---------- */

    const ASCII_EMBLEM = `   ▄▄▄▄▄▄▄
  █ ◉   ◉ █
  █   ▼   █
  █▄▄▄▄▄▄▄█`;

    const bar = (used, total, width = 12) => {
      const pct = Math.max(0, Math.min(1, used / (total || 1)));
      const filled = Math.round(pct * width);
      return '█'.repeat(filled) + '░'.repeat(width - filled);
    };

    const dotColor = (status) => {
      if (status === 'online') return 'text-[#39ff14]';
      if (status === 'unknown' || status === 'not_initialized') return 'text-gray-500';
      return 'text-[#ff007f]';
    };

    const PASTE_CHAR_THRESHOLD = 400;
    const PASTE_LINE_THRESHOLD = 8;

    const WAVEFORM_FRAMES = [
      '▁▂▃▅▇▅▃▂▁▂▃▅',
      '▂▃▅▇▅▃▂▁▂▃▅▇',
      '▃▅▇▅▃▂▁▂▃▅▇▅',
      '▅▇▅▃▂▁▂▃▅▇▅▃',
      '▇▅▃▂▁▂▃▅▇▅▃▂'
    ];

    /* ---------- Matrix-style ASCII rain background ---------- */

    function MatrixRain() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationId;
        const glyphs = 'SETHアイウエオカキクケコサシスセソ01ΩΔΣ0123456789';

        let cols, drops;
        const setup = () => {
          canvas.width = canvas.offsetWidth;
          canvas.height = canvas.offsetHeight;
          cols = Math.floor(canvas.width / 16);
          drops = new Array(cols).fill(0);
        };
        setup();
        window.addEventListener('resize', setup);

        const draw = () => {
          ctx.fillStyle = 'rgba(3, 3, 8, 0.12)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#00f0ff';
          ctx.font = '14px monospace';
          for (let i = 0; i < drops.length; i++) {
            const text = glyphs[Math.floor(Math.random() * glyphs.length)];
            ctx.fillText(text, i * 16, drops[i] * 16);
            if (drops[i] * 16 > canvas.height && Math.random() > 0.975) {
              drops[i] = 0;
            }
            drops[i]++;
          }
          animationId = requestAnimationFrame(draw);
        };
        draw();

        return () => {
          cancelAnimationFrame(animationId);
          window.removeEventListener('resize', setup);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full opacity-[0.12] pointer-events-none" />;
    }

    /* ---------- Main Application ---------- */

    function App() {
      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'SETH',
          type: 'system',
          text: `${ASCII_EMBLEM}\n┌────────────────────────────────────────────────────────┐\n│ SYSTEM SIGNAL RECEIVED ᓘ🔻 SET ORACLE:ACTIVE            │\n│ Project: ORACLE / SETH-IN-A-BOX                        │\n│ Channel: RAG-LOOP-777x | Mode: Fertile Glitch          │\n└────────────────────────────────────────────────────────┘`,
          timestamp: '14:53:00'
        }
      ]);

      const [input, setInput] = useState('');
      const [tokens, setTokens] = useState(1403);
      const [activeLora, setActiveLora] = useState(() => localStorage.getItem('seth_active_lora') || 'SETH');
      const [regulatorState, setRegulatorState] = useState('RIGOROUS');
      const [expandedTraceId, setExpandedTraceId] = useState(null);
      const [attachments, setAttachments] = useState([]);
      const [imageFile, setImageFile] = useState(null);
      const [isExpanded, setIsExpanded] = useState(false);
      const [isRecording, setIsRecording] = useState(false);
      const [recSeconds, setRecSeconds] = useState(0);
      const [waveIdx, setWaveIdx] = useState(0);
      const [telemetry, setTelemetry] = useState({ vram: [], qdrant: 'unknown', graphiti: 'unknown', vllm: 'unknown', whisper: 'unknown' });
      const [lastReplyId, setLastReplyId] = useState(null);
      const [isDraggingOver, setIsDraggingOver] = useState(false);
      const [showSettings, setShowSettings] = useState(false);

      const [apiBaseUrl, setApiBaseUrl] = useState(() => {
        const saved = localStorage.getItem('seth_api_base_url');
        if (saved) return saved;
        if (window.location.port && window.location.port !== '8080') {
          return `${window.location.protocol}//${window.location.hostname}:8080`;
        }
        return window.location.origin.startsWith('http') ? window.location.origin : 'http://127.0.0.1:8080';
      });

      const [userId, setUserId] = useState(() => localStorage.getItem('seth_user_id') || null);
      const [regToken, setRegToken] = useState('');
      const [isRegistering, setIsRegistering] = useState(false);
      const [regError, setRegError] = useState('');
      const [connStatus, setConnStatus] = useState('idle');

      const chatEndRef = useRef(null);
      const chatContainerRef = useRef(null);
      const fileInputRef = useRef(null);
      const textareaRef = useRef(null);
      const recTimerRef = useRef(null);
      const waveTimerRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const recordedChunksRef = useRef([]);
      const mediaStreamRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      useEffect(() => {
        textareaRef.current?.focus();
      }, []);

      useEffect(() => {
        const el = textareaRef.current;
        if (!el) return;
        el.style.height = 'auto';
        const max = isExpanded ? 420 : 96;
        el.style.height = Math.min(el.scrollHeight, max) + 'px';
      }, [input, isExpanded]);

      const handlePaste = (e) => {
        const text = e.clipboardData.getData('text');
        const lineCount = text.split('\n').length;
        if (text.length > PASTE_CHAR_THRESHOLD || lineCount > PASTE_LINE_THRESHOLD) {
          e.preventDefault();
          const preview = text.slice(0, 60).replace(/\n/g, ' ');
          setAttachments(prev => [...prev, {
            name: `Pasted text (${lineCount} lines)`,
            size: `${text.length} chars`,
            isPastedText: true,
            preview,
            content: text
          }]);
        }
      };

      // Telemetry Polling
      useEffect(() => {
        let cancelled = false;
        const poll = async () => {
          try {
            const resp = await fetch(`${apiBaseUrl.replace(/\/$/, '')}/api/status`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (cancelled) return;
            setTelemetry({
              vram: data.vram || [],
              qdrant: data.qdrant || 'unknown',
              graphiti: data.neo4j_graphiti || 'unknown',
              vllm: data.vllm || 'unknown',
              whisper: data.whisper || 'unknown'
            });
            setConnStatus('online');
          } catch (_) {
            if (cancelled) return;
            setTelemetry(prev => ({ ...prev, qdrant: 'offline', graphiti: 'offline', vllm: 'offline', whisper: 'offline' }));
            setConnStatus('error');
          }
        };

        poll();
        const id = setInterval(poll, 4000);
        return () => { cancelled = true; clearInterval(id); };
      }, [apiBaseUrl]);

      const handleScroll = (direction) => {
        chatContainerRef.current?.scrollBy({ top: direction * 120, behavior: 'smooth' });
      };

      const handleFilePick = () => fileInputRef.current?.click();

      const addFiles = (fileList) => {
        const files = Array.from(fileList || []);
        const image = files.find(f => f.type.startsWith('image/'));
        if (!image) return;
        setImageFile(prev => {
          if (prev?.previewUrl) URL.revokeObjectURL(prev.previewUrl);
          return {
            file: image,
            name: image.name,
            size: image.size > 1024 ? `${(image.size / 1024).toFixed(1)} KB` : `${image.size} B`,
            previewUrl: URL.createObjectURL(image)
          };
        });
      };

      const handleFileChange = (e) => {
        addFiles(e.target.files);
        e.target.value = '';
      };

      const removeImageFile = () => {
        setImageFile(prev => {
          if (prev?.previewUrl) URL.revokeObjectURL(prev.previewUrl);
          return null;
        });
      };

      const clearStagedImage = () => setImageFile(null);

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDraggingOver(true);
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        if (e.currentTarget === e.target) setIsDraggingOver(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDraggingOver(false);
        addFiles(e.dataTransfer.files);
      };

      const removeAttachment = (idx) => {
        setAttachments(prev => prev.filter((_, i) => i !== idx));
      };

      const pushSystemError = (text) => {
        const timestamp = new Date().toLocaleTimeString('en-US', { hour12: false });
        setMessages(prev => [...prev, { id: Date.now(), sender: 'SYSTEM', type: 'error', text, timestamp }]);
      };

      const toggleRecording = async () => {
        if (!isRecording) {
          if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
            pushSystemError('┌─ MIC UNAVAILABLE ────────────────────────────┐\n│ Browser does not support MediaRecorder.      │\n└──────────────────────────────────────────────┘');
            return;
          }
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStreamRef.current = stream;
            const recorder = new MediaRecorder(stream);
            recordedChunksRef.current = [];
            recorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunksRef.current.push(e.data); };
            recorder.start();
            mediaRecorderRef.current = recorder;

            setIsRecording(true);
            setRecSeconds(0);
            recTimerRef.current = setInterval(() => setRecSeconds(s => s + 1), 1000);
            waveTimerRef.current = setInterval(() => setWaveIdx(i => (i + 1) % WAVEFORM_FRAMES.length), 220);
          } catch (err) {
            pushSystemError(`┌─ MIC PERMISSION DENIED ──────────────────────┐\n│ ${String(err.message || err)}\n└──────────────────────────────────────────────┘`);
          }
          return;
        }

        setIsRecording(false);
        clearInterval(recTimerRef.current);
        clearInterval(waveTimerRef.current);

        const mins = Math.floor(recSeconds / 60);
        const secs = recSeconds % 60;
        const duration = `${mins}:${secs.toString().padStart(2, '0')}`;

        const recorder = mediaRecorderRef.current;
        if (!recorder) return;

        const blob = await new Promise((resolve) => {
          recorder.onstop = () => resolve(new Blob(recordedChunksRef.current, { type: recorder.mimeType || 'audio/webm' }));
          recorder.stop();
        });
        mediaStreamRef.current?.getTracks().forEach(t => t.stop());

        sendToSeth({ audioBlob: blob, audioDuration: duration });
      };

      const handleRegister = async () => {
        if (!regToken.trim()) return;
        setIsRegistering(true);
        setRegError('');
        try {
          const resp = await fetch(`${apiBaseUrl.replace(/\/$/, '')}/api/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: regToken.trim() })
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
          setUserId(data.user_id);
          localStorage.setItem('seth_user_id', data.user_id);
          setRegToken('');
        } catch (err) {
          setRegError(String(err.message || err));
        } finally {
          setIsRegistering(false);
        }
      };

      const handleForgetSession = () => {
        setUserId(null);
        localStorage.removeItem('seth_user_id');
      };

      const sendToSeth = async ({ text = '', audioBlob = null, audioDuration = null } = {}) => {
        if (!userId) {
          setShowSettings(true);
          pushSystemError('┌─ NOT REGISTERED ─────────────────────────────┐\n│ Open ⚙ SETTINGS and register with your      │\n│ REGISTRATION_TOKEN first.                    │\n└──────────────────────────────────────────────┘');
          return;
        }

        const pastedBlocks = attachments
          .filter(a => a.isPastedText)
          .map(a => `\n\n--- pasted text: ${a.name} ---\n${a.content}`)
          .join('');
        const fullText = text.trim() + pastedBlocks;

        const timestamp = new Date().toLocaleTimeString('en-US', { hour12: false });
        const sentImageFile = imageFile;
        const userMsg = {
          id: Date.now(),
          sender: 'USER',
          type: 'user',
          text: audioBlob ? '[ voice note ]' : (text.trim() || (sentImageFile ? '[ image ]' : '[ attachment ]')),
          timestamp,
          attachments: attachments.length ? attachments : undefined,
          imagePreview: sentImageFile?.previewUrl,
          audio: audioBlob ? { duration: audioDuration } : undefined
        };

        setMessages(prev => [...prev, userMsg]);
        setTokens(prev => prev + Math.floor(text.length / 3.5));
        setInput('');
        setAttachments([]);
        setIsExpanded(false);
        clearStagedImage();

        const replyId = Date.now() + 1;
        setMessages(prev => [...prev, {
          id: replyId,
          sender: activeLora,
          type: 'entity',
          text: '',
          timestamp: new Date().toLocaleTimeString('en-US', { hour12: false }),
          thinkingTrace: '',
          toolCalls: [],
          media: [],
          streaming: true
        }]);
        setLastReplyId(replyId);
        setConnStatus('connecting');

        const form = new FormData();
        form.append('message', fullText);
        if (sentImageFile?.file) form.append('image', sentImageFile.file);
        if (audioBlob) {
          const ext = (audioBlob.type.split('/')[1] || 'webm').split(';')[0];
          form.append('audio', audioBlob, `recording.${ext}`);
        }

        try {
          const resp = await fetch(`${apiBaseUrl.replace(/\/$/, '')}/api/chat`, {
            method: 'POST',
            headers: { 'X-Seth-User': userId },
            body: form
          });

          if (!resp.ok) {
            const errBody = await resp.json().catch(() => ({}));
            throw new Error(errBody.detail || `HTTP ${resp.status} — ${resp.statusText}`);
          }
          setConnStatus('online');

          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          let contentAcc = '';
          let reasoningAcc = '';
          let toolCalls = [];
          let media = [];
          let sawError = null;

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('data:')) continue;
              const data = trimmed.slice(5).trim();
              if (data === '[DONE]') continue;
              try {
                const json = JSON.parse(data);

                if (json.seth_event) {
                  const { type: evType, name, ok } = json.seth_event;
                  toolCalls = evType === 'tool_start'
                    ? [...toolCalls, { name, status: 'running' }]
                    : toolCalls.map(t => (t.name === name && t.status === 'running') ? { ...t, status: 'done', ok: ok !== false } : t);
                }

                const choice = json.choices?.[0] || {};
                const delta = choice.delta || {};
                if (delta.content) contentAcc += delta.content;
                if (delta.reasoning) reasoningAcc += delta.reasoning;

                if (choice.finish_reason === 'error') {
                  sawError = json.seth_meta?.error || 'Unknown error from SETH API.';
                } else if (choice.finish_reason === 'stop' && json.seth_meta) {
                  media = json.seth_meta.media || [];
                }

                setMessages(prev => prev.map(m => m.id === replyId
                  ? { ...m, text: contentAcc, thinkingTrace: reasoningAcc, toolCalls, media }
                  : m));
              } catch (_) { /* skip */ }
            }
          }

          if (sawError) {
            setMessages(prev => prev.map(m => m.id === replyId
              ? { ...m, streaming: false, type: 'error', sender: 'SYSTEM', text: `┌─ SETH ERROR ─────────────────────────────────┐\n│ ${sawError}\n└──────────────────────────────────────────────┘` }
              : m));
            return;
          }

          if (!contentAcc) contentAcc = '[ no content returned ]';

          setMessages(prev => prev.map(m => m.id === replyId ? { ...m, text: contentAcc, streaming: false } : m));
          setTokens(prev => prev + Math.floor(contentAcc.length / 3.5));
        } catch (err) {
          setConnStatus('error');
          setMessages(prev => prev.map(m => m.id === replyId
            ? {
                ...m,
                streaming: false,
                type: 'error',
                sender: 'SYSTEM',
                text: `┌─ CONNECTION FAILED ─────────────────────────┐\n│ Could not reach the SETH API at:            │\n│ ${apiBaseUrl}\n│ ${String(err.message || err)}\n└──────────────────────────────────────────────┘\nMake sure the backend API is running (python -m src.main api).`
              }
            : m));
        }
      };

      const handleSend = () => {
        if (!input.trim() && attachments.length === 0 && !imageFile) return;
        sendToSeth({ text: input });
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      };

      return (
        <div id="app-container" className="relative flex flex-col h-full border-2 border-[#00f0ff] bg-black box-glow rounded-sm overflow-hidden text-sm sm:text-base">

          <MatrixRain />

          {/* HEADER */}
          <div className="relative z-10 flex justify-between items-center bg-[#00f0ff]/10 backdrop-blur-[1px] border-b-2 border-[#00f0ff] px-4 py-2 select-none">
            <div className="flex items-center space-x-3">
              <span className="text-[#ff007f] font-bold glow-magenta animate-pulse">■</span>
              <h1 className="text-lg sm:text-xl tracking-widest font-bold glow-cyan text-[#00f0ff]">
                LOGGING // SETH WEB TUI CONSOLE
              </h1>
              <span className="hidden md:inline-block border border-[#39ff14] text-[#39ff14] text-xs px-2 py-0.5 glow-green">
                ORACLE:ACTIVE
              </span>
            </div>

            <div className="flex items-center space-x-2">
              <select
                value={activeLora}
                onChange={(e) => {
                  setActiveLora(e.target.value);
                  localStorage.setItem('seth_active_lora', e.target.value);
                }}
                className="bg-[#030308] border border-[#ffb000] text-[#ffb000] text-xs px-2 py-1 focus:outline-none glow-amber cursor-pointer"
              >
                <option value="SETH">LORA: SETH</option>
                <option value="ORACLE">LORA: ORACLE</option>
                <option value="GLITCHGOD">LORA: GLITCHGOD</option>
              </select>

              <button onClick={() => setShowSettings(v => !v)} className="border border-[#00f0ff] px-2 py-0.5 hover:bg-[#00f0ff] hover:text-[#030308] transition-colors font-bold text-xs" title="Connection settings">⚙ SETTINGS</button>
              <button onClick={() => handleScroll(-1)} className="border border-[#00f0ff] px-2 py-0.5 hover:bg-[#00f0ff] hover:text-[#030308] transition-colors font-bold" title="Scroll Up">▲</button>
              <button onClick={() => handleScroll(1)} className="border border-[#00f0ff] px-2 py-0.5 hover:bg-[#00f0ff] hover:text-[#030308] transition-colors font-bold" title="Scroll Down">▼</button>
            </div>
          </div>

          {/* CONNECTION SETTINGS PANEL */}
          {showSettings && (
            <div className="relative z-10 bg-[#070712] border-b-2 border-[#00f0ff] px-4 py-3 flex flex-wrap gap-3 items-end text-xs">
              <div className="flex flex-col gap-1">
                <label className="text-gray-500">SETH API BASE URL</label>
                <input
                  value={apiBaseUrl}
                  onChange={(e) => {
                    setApiBaseUrl(e.target.value);
                    localStorage.setItem('seth_api_base_url', e.target.value);
                  }}
                  className="bg-[#030308] border border-[#00f0ff]/50 text-[#00f0ff] px-2 py-1 w-64 focus:outline-none"
                />
              </div>

              {userId ? (
                <div className="flex flex-col gap-1">
                  <label className="text-gray-500">SESSION</label>
                  <div className="flex items-center gap-2 pb-1">
                    <span className="text-[#39ff14] glow-green">● REGISTERED [{userId.slice(0, 8)}…]</span>
                    <button
                      onClick={handleForgetSession}
                      className="text-[#ff007f] hover:underline"
                      title="Forget session"
                    >
                      forget
                    </button>
                  </div>
                </div>
              ) : (
                <React.Fragment>
                  <div className="flex flex-col gap-1">
                    <label className="text-gray-500">REGISTRATION_TOKEN</label>
                    <input
                      type="password"
                      value={regToken}
                      onChange={(e) => setRegToken(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleRegister()}
                      className="bg-[#030308] border border-[#00f0ff]/50 text-[#00f0ff] px-2 py-1 w-40 focus:outline-none"
                      placeholder="Token..."
                    />
                  </div>
                  <button
                    onClick={handleRegister}
                    disabled={isRegistering || !regToken.trim()}
                    className="border border-[#39ff14] text-[#39ff14] hover:bg-[#39ff14] hover:text-[#030308] disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-[#39ff14] px-3 py-1 font-bold glow-green transition-all"
                  >
                    {isRegistering ? '...' : 'REGISTER'}
                  </button>
                  {regError && <span className="text-[#ff007f] glow-magenta pb-1">✗ {regError}</span>}
                </React.Fragment>
              )}

              <span className={`pb-1 ${connStatus === 'online' ? 'text-[#39ff14]' : connStatus === 'error' ? 'text-[#ff007f]' : connStatus === 'connecting' ? 'text-[#ffb000]' : 'text-gray-500'}`}>
                ● {connStatus.toUpperCase()}
              </span>
            </div>
          )}

          {/* CHAT LOG */}
          <div
            ref={chatContainerRef}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
            onDrop={handleDrop}
            className="relative z-10 flex-1 overflow-y-auto p-4 space-y-6"
          >
            {isDraggingOver && (
              <div className="absolute inset-0 z-20 flex items-center justify-center bg-black/80 border-4 border-dashed border-[#00f0ff] m-2 pointer-events-none">
                <pre className="text-[#00f0ff] glow-cyan text-center text-sm sm:text-base">
{`┌──────────────────────────────┐
│   ⇩  DROP IMAGE INTO SETH  ⇩  │
└──────────────────────────────┘`}
                </pre>
              </div>
            )}

            {messages.map((msg) => (
              <div key={msg.id} className="space-y-1">
                <div className="flex items-center space-x-2">
                  <span className="text-xs text-gray-500">[{msg.timestamp}]</span>
                  <span className={`font-bold ${
                    msg.type === 'system' ? 'text-[#ff007f] glow-magenta' :
                    msg.type === 'error' ? 'text-[#ff007f] glow-magenta' :
                    msg.type === 'entity' ? 'text-[#39ff14] glow-green' :
                    'text-[#ffb000] glow-amber'
                  }`}>
                    [{msg.sender}]:
                  </span>
                </div>

                {msg.streaming ? (
                  <pre className="whitespace-pre-wrap pl-4 font-mono leading-relaxed text-[#00f0ff] glow-cyan">
                    {msg.text}<span className="blink">█</span>
                  </pre>
                ) : (
                  <pre className={`whitespace-pre-wrap pl-4 font-mono leading-relaxed ${
                    msg.type === 'entity' ? 'text-[#00f0ff] glow-cyan' :
                    msg.type === 'error' ? 'text-[#ff007f] glow-magenta' :
                    msg.type === 'system' ? 'text-[#39ff14] glow-green' : 'text-[#ffb000]'
                  }`}>
                    {msg.text}
                  </pre>
                )}

                {msg.attachments && (
                  <div className="pl-4 flex flex-wrap gap-2 pt-1">
                    {msg.attachments.map((a, i) => (
                      <span key={i} className="text-xs border border-[#00f0ff] text-[#00f0ff] px-2 py-0.5 glow-cyan max-w-xs truncate" title={a.preview}>
                        📄 {a.name} <span className="text-gray-500">({a.size})</span>
                      </span>
                    ))}
                  </div>
                )}

                {msg.imagePreview && (
                  <div className="pl-4 pt-1">
                    <img src={msg.imagePreview} alt="attached" className="max-w-[220px] max-h-[220px] border border-[#ffb000] glow-amber" />
                  </div>
                )}

                {msg.audio && (
                  <div className="pl-4 pt-1">
                    <div className="inline-flex items-center space-x-2 border border-[#ff007f] text-[#ff007f] px-3 py-1 text-xs glow-magenta">
                      <span>▶</span>
                      <span>▁▃▅▇▅▃▂▃▅▇▅▃▁</span>
                      <span>{msg.audio.duration}</span>
                    </div>
                  </div>
                )}

                {msg.toolCalls && msg.toolCalls.length > 0 && (
                  <div className="pl-4 flex flex-wrap gap-2 pt-1">
                    {msg.toolCalls.map((t, i) => (
                      <span
                        key={i}
                        className={`text-xs border px-2 py-0.5 font-mono ${
                          t.status === 'running'
                            ? 'border-[#ffb000] text-[#ffb000] glow-amber animate-pulse'
                            : 'border-[#39ff14] text-[#39ff14] glow-green'
                        }`}
                      >
                        {t.status === 'running' ? '⚙ ' : '✓ '}{t.name}
                      </span>
                    ))}
                  </div>
                )}

                {msg.thinkingTrace && (
                  <div className="pl-4 pt-1">
                    <button
                      onClick={() => setExpandedTraceId(expandedTraceId === msg.id ? null : msg.id)}
                      className="text-xs text-[#ff007f] hover:underline flex items-center space-x-1 font-mono glow-magenta"
                    >
                      <span>{expandedTraceId === msg.id ? '[-] Hide Thinking Trace' : '[+] View Thinking Trace'}</span>
                    </button>
                    {expandedTraceId === msg.id && (
                      <div className="mt-1 p-2 bg-[#00f0ff]/5 border-l-2 border-[#ff007f] text-xs text-gray-400 font-mono italic whitespace-pre-wrap">
                        {msg.thinkingTrace}
                      </div>
                    )}
                  </div>
                )}

                {/* GENERATED MEDIA CARDS */}
                {msg.media && msg.media.length > 0 && (
                  <div className="pl-4 flex flex-col gap-3 pt-2">
                    {msg.media.map((m, i) => {
                      const url = m.url.startsWith('http') ? m.url : `${apiBaseUrl.replace(/\/$/, '')}${m.url}`;
                      const localPath = m.path || '';

                      return m.type === 'image' ? (
                        <div key={i} className="flex flex-col max-w-lg bg-[#070712] border border-[#00f0ff] p-2 space-y-2 box-glow">
                          <div className="flex justify-between items-center text-xs">
                            <span className="text-[#00f0ff] font-bold glow-cyan">🖼️ GENERATED IMAGE</span>
                            <a
                              href={url}
                              target="_blank"
                              rel="noreferrer"
                              className="border border-[#00f0ff] text-[#00f0ff] px-2 py-0.5 hover:bg-[#00f0ff] hover:text-[#030308] font-bold text-[10px] transition-all"
                            >
                              ⤢ OPEN
                            </a>
                          </div>

                          <a href={url} target="_blank" rel="noreferrer" className="block text-center bg-black p-1">
                            <img
                              src={url}
                              alt="generated"
                              className="max-w-full max-h-[360px] mx-auto border border-[#00f0ff]/40 glow-cyan hover:scale-[1.01] transition-transform"
                            />
                          </a>

                          <div className="flex flex-col gap-1 text-[11px] bg-black/60 p-2 border-t border-[#00f0ff]/30 font-mono">
                            {localPath && (
                              <div className="flex items-center gap-2 overflow-hidden">
                                <span className="text-gray-500 font-bold flex-shrink-0">PATH:</span>
                                <a
                                  href={`file://${encodeURI(localPath)}`}
                                  target="_blank"
                                  rel="noreferrer"
                                  className="text-[#39ff14] glow-green hover:underline truncate flex-1"
                                  title="Open local file"
                                >
                                  {localPath}
                                </a>
                                <button
                                  onClick={(e) => {
                                    navigator.clipboard.writeText(localPath);
                                    const btn = e.currentTarget;
                                    btn.textContent = 'COPIED!';
                                    setTimeout(() => { btn.textContent = 'COPY'; }, 1500);
                                  }}
                                  className="border border-[#39ff14] text-[#39ff14] px-1.5 py-0.5 text-[10px] hover:bg-[#39ff14] hover:text-[#030308] font-bold flex-shrink-0"
                                >
                                  COPY
                                </button>
                              </div>
                            )}
                            <div className="flex items-center gap-2 overflow-hidden">
                              <span className="text-gray-500 font-bold flex-shrink-0">URL :</span>
                              <a href={url} target="_blank" rel="noreferrer" className="text-[#00f0ff] glow-cyan hover:underline truncate" title={url}>
                                {url}
                              </a>
                            </div>
                          </div>
                        </div>
                      ) : (
                        <div key={i} className="flex flex-col max-w-lg bg-[#070712] border border-[#ff007f] p-2 space-y-2 box-glow">
                          <div className="flex justify-between items-center text-xs">
                            <span className="text-[#ff007f] font-bold glow-magenta">🔊 GENERATED AUDIO</span>
                            <a href={url} target="_blank" download className="border border-[#ff007f] text-[#ff007f] px-2 py-0.5 hover:bg-[#ff007f] hover:text-white font-bold text-[10px]">
                              DOWNLOAD
                            </a>
                          </div>
                          <audio controls src={url} className="w-full h-8" />
                          {localPath && (
                            <div className="text-[11px] text-[#39ff14] truncate font-mono">
                              PATH: {localPath}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}

              </div>
            ))}
            <div ref={chatEndRef} />
          </div>

          {/* ATTACHMENT STAGING ROW */}
          {(attachments.length > 0 || imageFile) && (
            <div className="relative z-10 flex flex-wrap gap-2 px-4 pt-2 bg-[#030308] border-t border-[#00f0ff]/30">
              {attachments.map((a, i) => (
                <span key={i} className="chip-in text-xs border border-[#00f0ff] text-[#00f0ff] pl-2 pr-1 py-0.5 flex items-center gap-2 glow-cyan" title={a.preview}>
                  📄 {a.name} <span className="text-gray-500">({a.size})</span>
                  <button onClick={() => removeAttachment(i)} className="text-[#ff007f] hover:text-white font-bold px-1">×</button>
                </span>
              ))}
              {imageFile && (
                <span className="chip-in text-xs border border-[#ffb000] text-[#ffb000] pl-1 pr-1 py-0.5 flex items-center gap-2 glow-amber">
                  <img src={imageFile.previewUrl} alt="" className="w-6 h-6 object-cover" />
                  {imageFile.name} <span className="text-gray-500">({imageFile.size})</span>
                  <button onClick={removeImageFile} className="text-[#ff007f] hover:text-white font-bold px-1">×</button>
                </span>
              )}
            </div>
          )}

          {/* INPUT PANEL */}
          <div className="relative z-10 border-t-2 border-[#00f0ff] bg-[#030308]">
            <div className="flex items-start px-4 py-3 bg-[#0a0a18]">
              <span className="text-[#39ff14] font-bold text-xl mr-2 glow-green pt-0.5">&gt;</span>

              {isRecording ? (
                <div className="w-full flex items-center space-x-3 text-[#ff007f] py-1">
                  <span className="rec-pulse text-lg">●</span>
                  <span className="font-bold glow-magenta">REC</span>
                  <span className="glow-magenta tracking-widest">{WAVEFORM_FRAMES[waveIdx]}</span>
                  <span className="text-gray-400 text-xs">
                    {Math.floor(recSeconds / 60)}:{(recSeconds % 60).toString().padStart(2, '0')}
                  </span>
                </div>
              ) : (
                <textarea
                  ref={textareaRef}
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={handleKeyDown}
                  onPaste={handlePaste}
                  placeholder="Type a command, query, or paste code..."
                  rows="2"
                  style={{ caretColor: '#00f0ff' }}
                  className={`w-full bg-transparent text-[#00f0ff] focus:outline-none font-mono glow-cyan placeholder-gray-600 transition-all ${isExpanded ? 'resize-y overflow-y-auto' : 'resize-none overflow-hidden'}`}
                />
              )}

              {!isRecording && (
                <button
                  onClick={() => setIsExpanded(v => !v)}
                  title={isExpanded ? 'Collapse input' : 'Expand input'}
                  className="text-[#00f0ff]/60 hover:text-[#00f0ff] text-xs font-bold ml-2 pt-1 select-none"
                >
                  {isExpanded ? '⤡' : '⤢'}
                </button>
              )}
            </div>

            <div className="flex justify-between items-center border-t border-[#00f0ff]/40 px-3 py-2 bg-[#070712] gap-2 flex-wrap">
              <div className="flex items-center space-x-2">
                <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={handleFileChange} />
                <button
                  onClick={handleFilePick}
                  title="Attach image"
                  className="border border-[#00f0ff] text-[#00f0ff] hover:bg-[#00f0ff] hover:text-[#070712] px-3 py-1 text-xs font-bold transition-all glow-cyan"
                >
                  📎 IMAGE
                </button>
                <button
                  onClick={toggleRecording}
                  title={isRecording ? 'Stop recording' : 'Record audio'}
                  className={`border px-3 py-1 text-xs font-bold transition-all ${
                    isRecording
                      ? 'border-[#ff007f] bg-[#ff007f] text-[#030308] glow-magenta'
                      : 'border-[#ff007f] text-[#ff007f] hover:bg-[#ff007f] hover:text-[#030308] glow-magenta'
                  }`}
                >
                  {isRecording ? '■ STOP' : '● AUDIO'}
                </button>
                <select
                  value={regulatorState}
                  onChange={(e) => setRegulatorState(e.target.value)}
                  className="bg-[#030308] border border-[#00f0ff]/50 text-[#00f0ff] text-xs px-2 py-1 focus:outline-none"
                >
                  <option value="RIGOROUS">REGULATOR: RIGOROUS</option>
                  <option value="CHAOTIC">REGULATOR: CHAOTIC</option>
                  <option value="VERBOSE">REGULATOR: VERBOSE</option>
                </select>
              </div>

              <button
                onClick={handleSend}
                className="border-2 border-[#39ff14] text-[#39ff14] hover:bg-[#39ff14] hover:text-[#030308] px-5 py-1 text-xs sm:text-sm font-bold tracking-widest transition-all glow-green"
              >
                SEND [↵]
              </button>
            </div>

            {/* TELEMETRY STRIP */}
            <div className="flex flex-wrap justify-between items-center gap-x-4 gap-y-1 px-3 py-1.5 bg-black/60 border-t border-[#00f0ff]/20 text-[10px] sm:text-xs text-gray-400 font-mono">
              <span className="text-[#ffb000] glow-amber">TOKENS: <span className="text-white">{tokens}</span></span>
              {telemetry.vram.map((gpu) => (
                <span key={gpu.index} title={gpu.name}>
                  VRAM{gpu.index} [{bar(gpu.used_gb, gpu.total_gb || 1)}] {gpu.used_gb.toFixed(1)}/{gpu.total_gb.toFixed(1)}GB
                </span>
              ))}
              <span className={dotColor(telemetry.qdrant)}>● QDRANT</span>
              <span className={dotColor(telemetry.graphiti)}>● GRAPHITI</span>
              <span className={dotColor(telemetry.vllm)}>● vLLM</span>
              <span className={dotColor(telemetry.whisper)}>● WHISPER</span>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
